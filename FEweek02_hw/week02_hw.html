<!DOCTYPE html>
<html lang="kr">
<head>

    <link rel="stylesheet" href="week02_hw.css"/>
</head>
<body>
    <table class="container header-table">
        <tr>
            <td class="profile-img">
                <img src="./asset/profile.png" alt="profile">
            </td>
            <td>
                <p class="username">paxxword914</p>
                <p class="location">블루스퀘어</p>
            </td>
            <td class="more-btn">

        <tr>
            <td><img src="./asset/image.png" alt="image"></td>

            <td></td>

            <td class="bookmark"><img src="./asset/bookmark-unfilled.png" alt="bookmark" class="bookmark-icon"></td>
        </tr>
    </table>

    <table class="content-container text-table">
        <tr>
            <td class="username-content">
                <p class="bold-text">paxxword914</p>
            </td>
            <td class="post-content">
                <p>넥스지 쇼케이스에 다녀왔어요! </p>
            </td>
            <td class="more-content">
                <p>...더보기</p>
            </td>
        </tr>
    </table>
    <script src="week02_hw.js"></script>

</html>
